[project]
name = "wigglesat"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mjorbit",
    "mujoco>=3.7.0",
    "scipy>=1.17.1",
    "trimesh>=5.2.1",
    "viser>=1.1.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
mjorbit = { git = "https://github.com/johnzhang3/mjorbit", rev = "a09090671fe6299b1085d235623e4b2d00b4e675" }
